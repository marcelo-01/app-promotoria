; Sincronização do faturamento e dos brindes do ERP com o app de promotoria. Copie este arquivo para config.ini e
; preencha. O config.ini tem a senha do banco e a chave de envio: não mande para o servidor nem para o git.

[banco]
; Cópia do banco do ERP (Firebird 2.1), a mesma que o BI Mais Vida e o EFFEX Trade leem. Só leitura, numa transação
; somente leitura.
arquivo = C:\Users\Micro\Documents\banco de dados\LATICINIOMAISVIDALTDA.GDB
host = localhost
usuario = SYSDBA
senha = COLOQUE_A_SENHA_AQUI
fbclient = C:\Program Files\Firebird\Firebird_2_1\bin\fbclient.dll
codificacao = cp1252

[envio]
; Endereço do app, com /api no fim. Para testar com a API rodando no computador (docker compose): http://localhost:8002
destino = https://estoque.maisvida.cloud/api
; A mesma ERP_SYNC_KEY do .env do servidor (/opt/app-promotoria/.env). Gere com:
;   python -c "import secrets; print(secrets.token_urlsafe(32))"
chave =
