# Produção: sem bind mount de código, sem --reload, frontend servido por nginx
# direto na porta 8080, em HTTP puro.
# Uso: make prod-up   (ou: docker compose -f docker-compose.prod.yml up -d --build)
#
# HTTP e não HTTPS é decisão do deploy, não descuido: o app é alcançado por IP,
# sem domínio, e as portas 80/443 do IP público da empresa já pertencem a outro
# sistema — sem domínio não há certificado automático. O que se perde está na
# seção "Deploy" do README. O `Caddyfile` continua no repositório: no dia em que
# houver um domínio, é ele que devolve HTTPS, PWA instalável e modo offline.

# Log do Docker cresce sem limite por padrão e enche o disco do servidor com o
# app parado do lado, sem aviso.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgres:16-alpine
    container_name: estoque_postgres
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - estoque_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - estoque_network

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: estoque_api
    restart: unless-stopped
    logging: *logging
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_HOST: ${DATABASE_HOST}
      DATABASE_PORT: ${DATABASE_PORT}
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE_NAME: ${DATABASE_NAME}
      API_HOST: ${API_HOST}
      API_PORT: ${API_PORT}
      API_ENV: production
      SECRET_KEY: ${SECRET_KEY}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS}
      FRONTEND_URL: ${FRONTEND_URL}
      TIMEZONE: ${TIMEZONE:-America/Sao_Paulo}
    volumes:
      # Fotos dos produtos. Sem este volume, um redeploy com --build apagaria
      # todas as fotos junto com a imagem antiga do contêiner.
      - estoque_uploads:/app/uploads
    # As migrações rodam aqui, na subida, e não num passo manual do deploy:
    # esquecer o `alembic upgrade` deixava a API respondendo /health com 200 e
    # estourando 500 no login, que é o pior jeito de descobrir o problema.
    command: >
      sh -c "alembic upgrade head &&
             python -m uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      # Dá folga para as migrações antes de o contêiner ser considerado doente
      start_period: 60s
    depends_on:
      db:
        condition: service_healthy
    networks:
      - estoque_network

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        # URL pública da API — o build do Vite congela este valor no bundle.
        # Sem valor, o bundle sai apontando para localhost e o app não funciona
        # em nenhum celular; por isso a variável é obrigatória e não tem default.
        VITE_API_URL: ${VITE_API_URL:?defina VITE_API_URL=/api no .env}
    container_name: estoque_web
    restart: unless-stopped
    logging: *logging
    # O nginx fala direto com a internet, sem proxy na frente. Porta 8080 e não
    # 80 porque a 80 deste servidor é reivindicada pelo compose de produção do
    # ERP vizinho (`/opt/fv-laticinios`); o roteador redireciona a 8080 pública
    # para cá.
    #
    # Sem proxy no caminho, o nginx lê o IP de origem da própria conexão — é o
    # que mantém de pé o rate limit por IP do /auth/login em `nginx.prod.conf`,
    # que antes dependia do X-Forwarded-For escrito pelo Caddy.
    ports:
      - "8080:80"
    depends_on:
      - api
    networks:
      - estoque_network

volumes:
  estoque_pg_data:
    driver: local
  estoque_uploads:
    driver: local

networks:
  estoque_network:
    driver: bridge
