# App na raiz do domínio (base: '/'), diferente do ERP que serve em sub-path.
# Quem termina o TLS é o Caddy (ver `Caddyfile`); aqui só chega HTTP interno,
# vindo da rede do compose — este contêiner não publica porta no host.

# O IP que chega é sempre o do Caddy. Sem recuperar o original, o limite de taxa
# do login contaria a equipe inteira como um cliente só, e um celular teimoso
# bloquearia o login de todo mundo. Confiar no X-Forwarded-For só é seguro
# porque nada além do Caddy alcança este contêiner: ele não publica porta.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# Freio de força bruta no login. 10 por minuto por IP com rajada de 5 é
# folgado para quem erra a senha e apertado para quem varre um dicionário.
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;

server {
    listen 80;
    server_name _;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    root /usr/share/nginx/html;
    index index.html;

    # Assets com hash: cache longo
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # O service worker nunca pode ficar em cache, senão a atualização não chega
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Login: mesma coisa que o /api/ abaixo, com o freio de taxa. Match exato,
    # que tem precedência sobre o prefixo — por isso o caminho vai inteiro no
    # proxy_pass, sem a reescrita que o `/` final faz na outra location.
    location = /api/auth/login {
        limit_req zone=login burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://estoque_api:8000/auth/login;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # Proxy para a API (FastAPI) — inclui /api/uploads/, de onde saem as fotos
    # dos produtos.
    location /api/ {
        # O padrão do nginx é 1 MB e reprovaria o upload de uma foto de celular
        # com 413 antes de a requisição chegar na API. O teto acompanha o maior
        # upload que a API aceita — a planilha do ERP, de até 25 MB —, senão o
        # 413 sai daqui, em HTML, e a tela não tem como dizer o motivo.
        client_max_body_size 25m;
        proxy_pass http://estoque_api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # SPA
    location / {
        try_files $uri $uri/ /index.html;
    }
}
