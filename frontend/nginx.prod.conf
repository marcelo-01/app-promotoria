# App na raiz do domínio (base: '/'), diferente do ERP que serve em sub-path.
# HTTPS é obrigatório em produção: PWA instalável e service worker só funcionam
# em contexto seguro. Termine o TLS aqui ou num proxy à frente (Caddy/Traefik).
server {
    listen 80;
    server_name _;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    root /usr/share/nginx/html;
    index index.html;

    # Assets com hash: cache longo
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # O service worker nunca pode ficar em cache, senão a atualização não chega
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Proxy para a API (FastAPI)
    location /api/ {
        proxy_pass http://estoque_api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # SPA
    location / {
        try_files $uri $uri/ /index.html;
    }
}
